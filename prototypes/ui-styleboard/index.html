<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>奶龙历险记 · 次元驿站视觉方向 02</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="station" aria-label="次元驿站视觉方向二">
      <div class="sky" aria-hidden="true">
        <div class="sky__sun"></div>
        <div class="sky__veil sky__veil--one"></div>
        <div class="sky__veil sky__veil--two"></div>
        <div class="sky__stars"></div>
      </div>

      <div class="horizon" aria-hidden="true">
        <div class="horizon__mountain horizon__mountain--far"></div>
        <div class="horizon__mountain horizon__mountain--near"></div>
        <div class="horizon__cloud horizon__cloud--left"></div>
        <div class="horizon__cloud horizon__cloud--right"></div>
      </div>

      <header class="masthead">
        <a class="identity" href="#" aria-label="返回次元驿站首页">
          <span class="identity__mark">
            <svg viewBox="0 0 44 44" aria-hidden="true">
              <path d="M22 4 35 13v18L22 40 9 31V13L22 4Z" />
              <path d="M22 11c5 6 8 9 8 14a8 8 0 0 1-16 0c0-5 3-8 8-14Z" />
            </svg>
          </span>
          <span><small>DIMENSION TERMINAL</small><strong>奶龙历险记</strong></span>
        </a>

        <div class="account" aria-label="资源状态">
          <button type="button" data-toast="金币 · 用于装扮、伙伴与驿站陈设">
            <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="10" /><path d="M11 16h10M16 11v10" /></svg>
            <span>3,860</span>
          </button>
          <i></i>
          <button type="button" data-toast="次元碎片 · 用于解锁世界线索">
            <svg viewBox="0 0 32 32" aria-hidden="true"><path d="m16 5 9 9-9 14-9-14 9-9Z" /><path d="m7 14 9 3 9-3" /></svg>
            <span>12</span>
          </button>
          <button class="account__profile" type="button" aria-label="个人设置" data-toast="个人设置与存档状态">
            <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="12" r="5" /><path d="M7 27c1-6 4-9 9-9s8 3 9 9" /></svg>
          </button>
        </div>
      </header>

      <aside class="chapter" aria-label="当前世界">
        <span class="chapter__number">WORLD 01</span>
        <div class="chapter__rule"><i></i></div>
        <p>当前航线</p>
        <h2>林海秘境</h2>
        <span class="chapter__meta">晨雾森林 · 勘探进度 28%</span>
        <button type="button" data-toast="查看世界档案与已发现路线">
          查看世界档案
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 5 7 7-7 7" /></svg>
        </button>
      </aside>

      <section class="hero" aria-label="次元门与冒险入口">
        <div class="gateway" aria-hidden="true">
          <div class="gateway__aura"></div>
          <div class="gateway__spire gateway__spire--left"><i></i><i></i></div>
          <div class="gateway__spire gateway__spire--right"><i></i><i></i></div>
          <div class="gateway__arch gateway__arch--outer"></div>
          <div class="gateway__arch gateway__arch--inner"></div>
          <div class="gateway__surface">
            <i class="gateway__orbit gateway__orbit--one"></i>
            <i class="gateway__orbit gateway__orbit--two"></i>
            <i class="gateway__spark gateway__spark--one"></i>
            <i class="gateway__spark gateway__spark--two"></i>
            <i class="gateway__spark gateway__spark--three"></i>
          </div>
          <div class="gateway__threshold"></div>
          <div class="gateway__platform"><i></i><i></i><i></i></div>
        </div>

        <div class="hero__copy">
          <span class="hero__kicker">THE JOURNEY CONTINUES</span>
          <h1>穿过光，<br />去往下一个世界。</h1>
          <p>洞洞幺留下了新的次元波动。航线稳定，可以启程。</p>
          <button class="launch" type="button" data-toast="正式切片完成后，这里将无缝进入跑酷世界">
            <span>进入世界</span>
            <i></i>
            <svg viewBox="0 0 28 28" aria-hidden="true"><path d="m10 6 8 8-8 8" /></svg>
          </button>
        </div>
      </section>

      <aside class="dispatch" aria-label="今日线索">
        <div class="dispatch__eyebrow"><i></i><span>今日线索</span></div>
        <p>森林车站附近侦测到不稳定的罗盘信号。</p>
        <button type="button" data-toast="冒险手账 · 1 条新线索等待查看">
          <span>打开冒险手账</span>
          <small>01</small>
        </button>
      </aside>

      <nav class="navigation" aria-label="次元驿站功能入口">
        <button type="button" data-section="wardrobe">
          <svg viewBox="0 0 36 36" aria-hidden="true"><path d="m11 12 4-4c2 3 4 3 6 0l4 4 6 3-4 7-4-2v9H13v-9l-4 2-4-7 6-3Z" /></svg>
          <span><small>01</small>换装</span>
        </button>
        <button type="button" data-section="partner">
          <svg viewBox="0 0 36 36" aria-hidden="true"><path d="M18 29S7 23 7 15c0-5 6-7 11-1 5-6 11-4 11 1 0 8-11 14-11 14Z" /></svg>
          <span><small>02</small>伙伴</span>
        </button>
        <button class="is-active" type="button" data-section="adventure">
          <svg viewBox="0 0 36 36" aria-hidden="true"><path d="M18 4c4 5 10 7 10 15 0 6-5 11-10 13-5-2-10-7-10-13C8 11 14 9 18 4Z" /><path d="M13 21c3-4 7-4 10 0" /></svg>
          <span><small>03</small>冒险</span>
        </button>
        <button type="button" data-section="archive">
          <svg viewBox="0 0 36 36" aria-hidden="true"><path d="M8 7h20v22H8z" /><path d="M13 13h10M13 18h7M13 23h9" /></svg>
          <span><small>04</small>藏品</span>
          <i class="navigation__notice"></i>
        </button>
        <button type="button" data-section="store">
          <svg viewBox="0 0 36 36" aria-hidden="true"><path d="M7 15h22L27 7H9l-2 8Z" /><path d="M10 15v14h16V15M15 29v-8h6v8" /></svg>
          <span><small>05</small>商店</span>
        </button>
      </nav>

      <footer class="statusline">
        <span><i></i> 次元航线稳定</span>
        <span>视觉方向 02 · 角色与正式场景资产待确认</span>
      </footer>

      <div class="toast" role="status" aria-live="polite"></div>
    </main>
    <script src="./styleboard.js"></script>
  </body>
</html>
